[project]
name = "enterprise-knowledge-service"
version = "0.1.0"
description = "Enterprise knowledge base and customer service assistant."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "python-dotenv>=1.2.0,<2.0.0",
    "requests>=2.31.0",
    "openai>=1.12.0,<2.0.0",
    "uvicorn[standard]>=0.32.0",
    "loguru>=0.7.3",
    # KB（知识库）依赖
    "pydantic>=2.0",
    "httpx>=0.27",
    "chromadb>=1.5.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "rank_bm25>=0.2",
    "fastembed>=0.7.4,<0.9.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "rapidocr>=3.9.0",
    "onnxruntime>=1.19",
    "PyMuPDF>=1.25",
    "Pillow>=10.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "pytest>=8.0"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 源码平铺在 src/ 下（config.py、main.py 两个顶层模块 + services 包），
# package-dir 把 src 映射为安装根；packages.find 只扫 src，
# 顶层 .py 文件用 py-modules 显式声明（否则 pip install -e . 报 src/src 不存在）
package-dir = {"" = "src"}
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "ruff>=0.12.7",
]
