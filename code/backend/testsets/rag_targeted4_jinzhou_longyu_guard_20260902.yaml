    expect_inline_citations: true
    expected_sources:
      - data_kb_test/cninfo_annual/ST龙宇-上海龙宇数据股份有限公司2024年年度报告.pdf
    expected_pages: [7]
    expected_evidence:
      - "主要会计数据"
      - "营业收入 1,404,920,973.02"
    expected_answer: "2024年营业收入为1,404,920,973.02元。"
    tags: [numeric, table, company_year]

