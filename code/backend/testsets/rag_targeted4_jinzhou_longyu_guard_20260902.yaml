# 从 rag_real_quality_v2.yaml 原样抽取的四题 Chroma 定向质量契约。
# 仅用于一次性 targeted run；不得修改字段以迎合候选答案。
name: rag_targeted4_jinzhou_longyu_guard_20260902
version: 2
kb_id: cninfo_report
description: >-
  四题定向质量集：Jinzhou 双字段门禁、Longyu 字段绑定，以及 Huawei/Shenlian 防退化。
source_roots:
  - data_kb_test/cninfo
  - data_kb_test/cninfo_annual
tests:
  - id: real_jinzhou_port_2025_plan_not_promise
    category: page_section_evidence
    kb_id: cninfo_report
    question: "锦州港2024年年报披露的2025年经营计划中，计划营业收入是多少？该计划是否构成业绩承诺？"
    expect_answerable: true
    expect_intent: kb_question
    expect_keywords_all: ["17.21亿元", "不构成对投资者的业绩承诺"]
    expect_min_citations: 1
    expect_inline_citations: true
    expected_sources:
      - data_kb_test/cninfo_annual/ST锦港-锦州港股份有限公司2024年年度报告.pdf
    expected_pages: [25]
    expected_evidence:
      - "公司拟定2025年度计划实现营业收入17.21亿元"
      - "上述经营计划并不构成公司对投资者的业绩承诺"
    expected_answer: "计划营业收入为17.21亿元；报告明确说明该经营计划不构成对投资者的业绩承诺。"
    tags: [page_evidence, section, plan, refusal_boundary]

  - id: real_longyu_2024_revenue
