# 基于仓库真实 cninfo PDF 的 RAG V2 质量题集。
# 页码均为 PDF 物理页（从 1 开始），expected_* 字段供人工复核和后续 A/B
# 评测使用；evaluate_quality.py 仍可直接消费 tests/question/expect_* 字段。
name: rag_real_quality_v2
version: 2
kb_id: cninfo_report
description: >-
  真实年报与半年报质量集，覆盖公司/年份辨别、表格数字、章节和页码证据、
  同义改写、跨段上下文、多文档一致性以及无答案拒答。事实只来自仓库内 PDF。
source_roots:
  - data_kb_test/cninfo
  - data_kb_test/cninfo_annual

tests:
  - id: real_guangdao_2025_h1_notice_dissent
    category: page_section_evidence
    kb_id: cninfo_report
    question: "ST广道2025年半年度报告中，明确表示无法保证报告内容真实、准确、完整的董事和监事分别是谁？"
    expect_answerable: true
    expect_intent: kb_question
    expect_keywords_all: ["杨彬", "周绍鑫", "刘海军", "陈友志"]
    expect_min_citations: 1
    expect_inline_citations: true
    expected_sources:
      - data_kb_test/cninfo/ST广道-2025年半年度报告.pdf
    expected_pages: [3]
    expected_evidence:
      - "第一节 重要提示、目录和释义"
      - "公司董事杨彬、监事周绍鑫、刘海军、陈友志对半年度报告内容存在异议"
    expected_answer: "董事杨彬；监事周绍鑫、刘海军、陈友志。"
    tags: [page_evidence, section, people, company_year]

  - id: real_pawa_2024_notice_dissent
    category: page_section_evidence
    kb_id: cninfo_report
    question: "浙江帕瓦新能源股份有限公司2024年年报中，哪两名董事无法保证报告内容的真实性、准确性和完整性？"
    expect_answerable: true
    expect_intent: kb_question
    expect_keywords_all: ["邓超", "凌敏"]
    expect_min_citations: 1
    expect_inline_citations: true
    expected_sources:
      - data_kb_test/cninfo_annual/帕瓦股份-浙江帕瓦新能源股份有限公司2024年年度报告.pdf
    expected_pages: [2]
    expected_evidence:
      - "重要提示"
      - "邓超、凌敏董事无法保证本报告内容的真实性、准确性和完整性"
    expected_answer: "邓超、凌敏。"
