    expect_answerable: true
    expect_keyword: "采购人"
    expect_min_citations: 1
    expect_top_score_min: 0.60
  - question: "采购金额达到多少必须公开招标？"
    expect_answerable: true
    expect_min_citations: 1
    expect_top_score_min: 0.60
  - question: "今天天气怎么样？"
    expect_intent: smalltalk
