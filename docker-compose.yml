name: kb-assistant

# 企业知识库管理助手 · Docker Compose 编排
# 一条命令拉起全栈：docker compose up --build
# 停止：docker compose down（数据卷保留）
# 彻底清数据：docker compose down -v
#
# 服务拓扑：
#   ollama (bge-m3, 内网 :11434)
#     ↑
#   backend (FastAPI :8000) ← env_file .env (LLM_API_KEY 等)
#     ↑
#   frontend (Nginx :5174) → /api 反向代理到 backend

services:
  ollama:
    image: ollama/ollama:latest
    container_name: kb-ollama
    # 启动 ollama serve，等就绪后自动拉 bge-m3（首次约 2GB，后续秒过）
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & sleep 8 && ollama pull bge-m3 && wait"]
    volumes:
      - ollama_models:/root/.ollama
    # 不映射端口到宿主机（仅 compose 内网）；后端通过 http://ollama:11434 访问
    # 如需宿主机直连 ollama，取消下行注释（注意与宿主机 ollama 端口冲突）
    # ports:
    #   - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kb-qdrant
    # 复用 2026-08 评测语料卷：kb_full_codex_20260830_24c7407e（73,662 分块，bge-m3）
    volumes:
      - kb_qdrant_preflight_data_20260828-141124-ca47dc59:/qdrant/storage
    # 不映射到宿主机 6333（可能与宿主机 Qdrant 冲突），用 16334 仅供排障
    ports:
      - "16334:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    build: ./code/backend
    container_name: kb-backend
    environment:
      APP_ENV: production
      # 连 compose 内网的 ollama（不是宿主机的 127.0.0.1）
      KB_OLLAMA_HOST: http://ollama:11434
      KB_EMBEDDING_MODE: bge_m3
      KB_EMBEDDING_MODEL: bge-m3
      # 向量后端切换到 Qdrant（评测语料所在库），Chroma 数据卷保留不再使用
      KB_VECTOR_BACKEND: qdrant
      KB_QDRANT_URL: http://qdrant:6333
      KB_QDRANT_COLLECTION: kb_full_codex_20260830_24c7407e
      KB_QDRANT_VECTOR_SIZE: 1024
      # 数据放 /app/data，挂卷持久化（checkpoint + users db + 指标库）
      KB_CHROMA_DIR: /app/data/chroma_data
    env_file:
      # 加载 LLM_API_KEY / LLM_BASE_URL / LLM_MODEL_ID 等（DeepSeek）
      - code/backend/.env
    volumes:
      - kb_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./code/frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: kb-frontend
    ports:
      # Windows 当前保留了 5141-5240 端口段，使用 3000 作为本机访问端口。
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_models:   # bge-m3 模型缓存（首次拉取后持久化）
  kb_data:         # checkpoint + 用户权限 db + 指标库（chroma 数据仍在卷内，已切换到 Qdrant 后端）
  # 评测语料卷（2026-08 预检创建，含 73,662 分块的财报评测集合），外部已有卷直接挂载
  kb_qdrant_preflight_data_20260828-141124-ca47dc59:
    external: true
